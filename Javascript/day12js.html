<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <h1 align = "center">User Input</h1>
    <form id="form1" onsubmit="Display(event)">
        Enter the text : <input type = "Text" id="input">
        <input type = "submit"  value = "submit">
    </form>
    <p id = "output"
    onmouseover="moverDisplayGreen()"
    onmouseout="moutDisplayBlue()"></p>

    <script>
        function Display(event){
            event.preventDefault();

            let text = document.getElementById("input").value
            document.getElementById("output").innerHTML = text;
            document.getElementById("output").style.color = "blue";
        }

        function moverDisplayGreen(){
            document.getElementById("output").style.color = "green";
        }
        function moutDisplayBlue(){
            document.getElementById("output").style.color = "blue";
        }
    </script>
</body>
</html>
