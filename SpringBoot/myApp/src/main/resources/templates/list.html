<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Product List</title>

</head>

<body>

<h2>Product List</h2>

<form action="/all"
      method="get">

    <input type="text"
           name="keyword"
           placeholder="Search">

    <button type="submit">
        Search
    </button>

</form>

<br>

<table border="1">

    <thead>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Expiry Date</th>
            <th>Actions</th>
        </tr>

    </thead>

    <tbody>

        <tr th:each="product : ${products}">

            <td th:text="${product.id}">
            </td>

            <td th:text="${product.name}">
            </td>

            <td th:text="${product.description}">
            </td>

            <td th:text="${product.price}">
            </td>

            <td th:text="${product.expirydate}">
            </td>

            <td>

                <a th:href="@{/update/{id}(id=${product.id})}">
                    Edit
                </a>

                |

                <a th:href="@{/delete/{id}(id=${product.id})}">
                    Delete
                </a>

            </td>

        </tr>

    </tbody>

</table>

<br>

<a href="/create">
    Add Product
</a>

</body>
</html>
