<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <h1 align="center">Register For Membership</h1>
    <form action="/register" method="post">
        <label>Name : <input type="text" name="name"></label><br><br>
        <label>Date of birth : <input type="text" name="dob" placeholder="dd/mm/yyyy"></label><br><br>
        <label>Address : <input type = "text" name="address"></label><br><br>
        <label>Email : <input type="text" name="email"></label><br><br>
        <label>Password : <input type="password" name="password"></label><br><br>
        <button type="submit" name="submit">Submit</button>
    </form>
</body>
</html>
