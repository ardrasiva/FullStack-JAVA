<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Mobile</title>
</head>
<body>

    <h2>Delete Mobile Phone</h2>

    <p>
        Are you sure you want to delete this phone?
    </p>

    <p>
        Name:
        <span th:text="${Mobiledetails.name}"></span>
    </p>

    <p>
        Description:
        <span th:text="${Mobiledetails.description}"></span>
    </p>

    <p>
        Price:
        <span th:text="${Mobiledetails.price}"></span>
    </p>

    <form th:action="@{/delete/{id}(id=${Mobiledetails.id})}" method="post">

        <button type="submit">Yes, Delete</button>

    </form>

    <br>

    <a href="/all">Cancel</a>

</body>
</html>
