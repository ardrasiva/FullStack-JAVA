<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Mobile</title>
</head>
<body>

    <h2>Update Mobile Phone</h2>

    <form th:action="@{/update/{id}(id=${Mobiledetails.id})}"
          th:object="${Mobiledetails}"
          method="post">

        Name:
        <input type="text" th:field="*{name}">
        <br><br>

        Description:
        <input type="text" th:field="*{description}">
        <br><br>

        Price:
        <input type="number" step="0.01" th:field="*{price}">
        <br><br>

        <button type="submit">Update Phone</button>

    </form>

    <br>

    <a href="/all">Back to Phone List</a>

</body>
</html>
